name: Docs

on:
  push:
    branches: [main, "staging/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # read the Pages site base path
    outputs:
      site: ${{ steps.detect.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect site
        id: detect
        run: |
          if [[ -f site/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        id: pages
        if: steps.detect.outputs.present == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Zig
        if: steps.detect.outputs.present == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build API reference
        if: steps.detect.outputs.present == 'true'
        run: zig build docs

      # Nuxt Content reads the guides through node:sqlite, added in Node 22.5.
      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install site dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Generate site
        if: steps.detect.outputs.present == 'true'
        working-directory: site
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
        run: bun run generate

      - name: Upload Pages artifact
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.output/public

  deploy:
    name: deploy
    needs: build
    if: success() && needs.build.outputs.site == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # publish the static site
      id-token: write # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
