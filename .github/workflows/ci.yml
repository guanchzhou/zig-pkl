name: CI

on:
  push:
    # Commits are checked on a staging branch first; main then fast-forwards
    # to the same commit, which already carries the required checks.
    branches: [main, "staging/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"
  # Pkl release the test job installs. Each matrix entry pins the SHA-256 of
  # its release asset; update both together.
  PKL_VERSION: "0.32.2"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # Tests fail instead of skipping when Pkl cannot be started.
      ZIG_PKL_REQUIRE_PKL: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x86_64
            pkl_asset: pkl-linux-amd64
            pkl_sha256: 874c75484c79add77fb2346ea4ab2e8875eea35fb707894bf5457a2df5d03def
            pkl_file: pkl
          - runner: ubuntu-24.04-arm
            name: linux-aarch64
            pkl_asset: pkl-linux-aarch64
            pkl_sha256: e60744e17d4ddc0257a35260998b5f98387b5d6a5e868317cccfbebe8d962ae3
            pkl_file: pkl
          - runner: macos-26
            name: macos-aarch64
            pkl_asset: pkl-macos-aarch64
            pkl_sha256: 466952f0b30c93dfa36393a5b3695159917ce4291e3c936a18a0a240cfbe98e9
            pkl_file: pkl
          - runner: windows-2025
            name: windows-x86_64
            pkl_asset: pkl-windows-amd64.exe
            pkl_sha256: ac3c55c2e43c20964dc5faf51e47bf73a90150dfe1874aa37753651753edf201
            pkl_file: pkl.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install Pkl
        shell: bash
        env:
          PKL_ASSET: ${{ matrix.pkl_asset }}
          PKL_SHA256: ${{ matrix.pkl_sha256 }}
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PKL_EXEC")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$PKL_EXEC" "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/${PKL_ASSET}"
          # Hash from standard input: with a file name that contains a
          # backslash, as on Windows, sha256sum prefixes its output with `\`.
          if command -v sha256sum > /dev/null; then
            actual="$(sha256sum < "$PKL_EXEC" | cut -d ' ' -f 1)"
          else
            actual="$(shasum -a 256 < "$PKL_EXEC" | cut -d ' ' -f 1)"
          fi
          if [ "$actual" != "$PKL_SHA256" ]; then
            echo "::error::SHA-256 of ${PKL_ASSET} is ${actual}, expected ${PKL_SHA256}"
            exit 1
          fi
          chmod +x "$PKL_EXEC"
          "$PKL_EXEC" --version

      - name: Format
        run: zig fmt --check .

      - name: Build
        run: zig build

      - name: Test
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: zig build test

      - name: Integration tests
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: zig build integration-test

      - name: Conformance
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: zig build conformance

      - name: Code generation tests
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: zig build codegen-test

      - name: Checked-in bindings are current
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: zig build codegen -- --check

      - name: ReleaseSafe tests
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/${{ matrix.pkl_file }}
        run: zig build test integration-test conformance codegen-test -Doptimize=ReleaseSafe

  pkl-versions:
    name: pkl ${{ matrix.pkl }} (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZIG_PKL_REQUIRE_PKL: "1"
    strategy:
      fail-fast: false
      matrix:
        # Releases before 0.29 publish no checksums; these hashes were computed
        # from the release assets when they were added.
        include:
          - pkl: "0.25.3"
            sha256: fb2c8ad5de113a1246599e893492736b79e73bdf986ba4caf305cd09aae82c10
          - pkl: "0.26.3"
            sha256: 34a082cb603b7924788762058a230e238b6b3e1b5c525549fac5a0765769c47e
          - pkl: "0.27.2"
            sha256: e220577f9d48d872e358e939702d3d38f34d4afd29aecd34cc96b5dc67d880d5
          - pkl: "0.28.2"
            sha256: ba8722ba6971f7cb2b8b90fdca76c947a9510a57119baf05263bf4fcf9f9b0ba
          - pkl: "0.29.1"
            sha256: 0925a87b00f19d40c4cf8a3eadb0b2af3138f2a8c15071966d51f5c737b42804
          - pkl: "0.30.2"
            sha256: 474e5137d60a9e2320fde19a526f42c36d8e9d3b245139d59a9b8dff85283c76
          - pkl: "0.31.1"
            sha256: 618f13955d755cafbfe8c9cba1d27635848cd49dbc6abffd398d2751db1231bf
          - pkl: "0.32.2"
            sha256: 874c75484c79add77fb2346ea4ab2e8875eea35fb707894bf5457a2df5d03def
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install Pkl
        env:
          MATRIX_PKL: ${{ matrix.pkl }}
          MATRIX_SHA256: ${{ matrix.sha256 }}
          PKL_EXEC: ${{ runner.temp }}/pkl/pkl
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PKL_EXEC")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$PKL_EXEC" "https://github.com/apple/pkl/releases/download/${MATRIX_PKL}/pkl-linux-amd64"
          actual="$(sha256sum < "$PKL_EXEC" | cut -d ' ' -f 1)"
          if [ "$actual" != "$MATRIX_SHA256" ]; then
            echo "::error::SHA-256 of pkl ${MATRIX_PKL} is ${actual}, expected ${MATRIX_SHA256}"
            exit 1
          fi
          chmod +x "$PKL_EXEC"
          "$PKL_EXEC" --version

      - name: Conformance and integration tests
        env:
          PKL_EXEC: ${{ runner.temp }}/pkl/pkl
        run: zig build conformance integration-test

  checks:
    name: fuzz and links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Fuzz decoders
        run: zig build fuzz

      - name: Markdown links
        run: zig build check-links

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos
          - x86_64-macos
          - x86_64-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Build target
        env:
          ZIG_TARGET: ${{ matrix.target }}
        run: zig build -Dtarget="$ZIG_TARGET"

  bench:
    name: bench (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # pkl-zig 6a113ab builds only with Zig 0.16.0.
      ZIG_0_16_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      ZIG_0_16_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      PKL_SHA256: 874c75484c79add77fb2346ea4ab2e8875eea35fb707894bf5457a2df5d03def
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install Pkl and Zig 0.16.0
        env:
          TOOLS: ${{ runner.temp }}/tools
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS"
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$1" "$2"
            actual="$(sha256sum < "$1" | cut -d ' ' -f 1)"
            if [ "$actual" != "$3" ]; then
              echo "::error::SHA-256 of $2 is ${actual}, expected $3"
              exit 1
            fi
          }
          fetch "$TOOLS/pkl" "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-linux-amd64" "$PKL_SHA256"
          chmod +x "$TOOLS/pkl"
          fetch "$TOOLS/zig-0.16.tar.xz" "$ZIG_0_16_URL" "$ZIG_0_16_SHA256"
          mkdir -p "$TOOLS/zig-0.16"
          tar -xJf "$TOOLS/zig-0.16.tar.xz" -C "$TOOLS/zig-0.16" --strip-components=1
          "$TOOLS/pkl" --version
          "$TOOLS/zig-0.16/zig" version

      - name: Compare with pkl-zig
        env:
          PKL_EXEC: ${{ runner.temp }}/tools/pkl
          ZIG_0_16: ${{ runner.temp }}/tools/zig-0.16/zig
          OUT: ${{ runner.temp }}/bench
        run: |
          set -uo pipefail
          bench/compare.sh 15
          status=$?
          if [ -f "$OUT/summary.md" ]; then
            { echo "## zig-pkl and pkl-zig, same run"; echo; cat "$OUT/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-linux-x86_64
          path: ${{ runner.temp }}/bench
          if-no-files-found: ignore

  zig-master:
    name: zig master
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Zig master
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: master
          use-cache: false

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
