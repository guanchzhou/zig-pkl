name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.0"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "build.zig.zon has no .version" >&2
            exit 1
          fi
          printf 'package version %s\n' "$version"
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            exit 0
          fi
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$RELEASE_REF_NAME" =~ $tag_re ]]; then
            echo "tag ${RELEASE_REF_NAME} must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag_version="${RELEASE_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "tag ${RELEASE_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          escaped="${version//./\\.}"
          if ! grep -Eq "^## \\[${escaped}\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Format
        run: zig fmt --check .

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  package:
    name: package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless signing identity
      attestations: write # publish artifact attestations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create source archive
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -n 1)"
          mkdir -p dist
          prefix="zig-pkl-${version}/"
          git archive --format=tar --prefix="$prefix" HEAD \
            | gzip --no-name > "dist/zig-pkl-${version}.tar.gz"
          if [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
            # shellcheck disable=SC2016 # $0 is an awk field, not a shell expansion
            awk -v ver="$version" '
              BEGIN { heading = "## [" ver "]" }
              found && index($0, "## ") == 1 { exit }
              index($0, heading) == 1 { found = 1 }
              found { print }
            ' CHANGELOG.md > dist/release-notes.md
          else
            printf 'Dry run for %s\n' "$version" > dist/release-notes.md
          fi

      - name: SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: dist/zig-pkl.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false

      - name: CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: dist/zig-pkl.cdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz zig-pkl.spdx.json zig-pkl.cdx.json > SHA256SUMS

      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.json
            dist/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: package
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: downloaded

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          find downloaded -type f -exec cp -p {} assets/ \;
          test -s assets/release-notes.md
          test -s assets/SHA256SUMS
          test -s assets/SHA256SUMS.bundle
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file assets/release-notes.md \
            assets/zig-pkl-*.tar.gz \
            assets/zig-pkl.spdx.json \
            assets/zig-pkl.cdx.json \
            assets/SHA256SUMS \
            assets/SHA256SUMS.bundle
